spring:
  application.name: vocabflow
  datasource:
    url: ${VOCABFLOW_DB_URL:jdbc:mysql://localhost:3306/vocabflow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${VOCABFLOW_DB_USERNAME:vocabflow}
    password: ${VOCABFLOW_DB_PASSWORD}
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway: { enabled: true }
server: { error: { include-message: never } }
vocabflow:
  auth:
    secret: "${VOCABFLOW_AUTH_SECRET}"
    token-hours: 24
  enrichment:
    # fake (deterministic placeholder content) or claude (real model; needs VOCABFLOW_ANTHROPIC_API_KEY)
    provider: ${VOCABFLOW_ENRICHMENT_PROVIDER:fake}
    # Run enrichment on the calling thread instead of the background pool. Tests only.
    inline: false
    daily-limit: ${VOCABFLOW_ENRICHMENT_DAILY_LIMIT:50}
    claude:
      api-key: ${VOCABFLOW_ANTHROPIC_API_KEY:}
      model: ${VOCABFLOW_ENRICHMENT_MODEL:claude-haiku-5-5}
      timeout-seconds: 30
