spring:
  application.name: vocabflow
  datasource:
    url: ${VOCABFLOW_DB_URL:jdbc:mysql://localhost:3306/vocabflow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${VOCABFLOW_DB_USERNAME:vocabflow}
    password: ${VOCABFLOW_DB_PASSWORD}
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway: { enabled: true }
server: { error: { include-message: never } }
vocabflow:
  auth:
    secret: "${VOCABFLOW_AUTH_SECRET}"
    token-hours: 24
